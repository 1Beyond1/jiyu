services:
  app:
    build: .
    image: jiyu:local
    restart: unless-stopped
    environment:
      JIYU_ORIGIN: ${JIYU_ORIGIN:?请在 .env 中配置 JIYU_ORIGIN}
      JIYU_DATA_DIR: /data/${JIYU_DATA_SUBDIR:-live}
      JIYU_QUOTA_MB: ${JIYU_QUOTA_MB:-10240}
      JIYU_REQUEST_MB: ${JIYU_REQUEST_MB:-512}
      JIYU_TRUST_PROXY: 'true'
      JIYU_BACKUP_DIR: /backups
      JIYU_BACKUP_MAX_KEEP: ${JIYU_BACKUP_MAX_KEEP:-30}
      JIYU_AI_BASE_URL: ${JIYU_AI_BASE_URL:-}
      JIYU_AI_MODEL: ${JIYU_AI_MODEL:-}
      JIYU_AI_KEY: ${JIYU_AI_KEY:-}
      JIYU_AI_PROTOCOL: ${JIYU_AI_PROTOCOL:-chat}
      JIYU_AI_DAILY_CALLS: ${JIYU_AI_DAILY_CALLS:-50}
      JIYU_RATE_LIMIT_GLOBAL: ${JIYU_RATE_LIMIT_GLOBAL:-180}
      JIYU_RATE_LIMIT_UPLOAD_MULTIPART: ${JIYU_RATE_LIMIT_UPLOAD_MULTIPART:-30}
      JIYU_RATE_LIMIT_UPLOAD_CREATE: ${JIYU_RATE_LIMIT_UPLOAD_CREATE:-60}
      JIYU_RATE_LIMIT_UPLOAD_CHUNK: ${JIYU_RATE_LIMIT_UPLOAD_CHUNK:-180}
    volumes:
      - data:/data
      - backups:/backups
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '2' }
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      JIYU_DOMAIN: ${JIYU_DOMAIN:?请在 .env 中配置 JIYU_DOMAIN}
    ports: ['80:80', '443:443', '443:443/udp']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: '2' }
volumes:
  data:
  backups:
  caddy_data:
  caddy_config:
