name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck and build
        run: npm run build
      - name: Test file service and collection rules
        run: npm test
  container:
    name: Container smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and boot container
        run: |
          docker build -t jiyu:test .
          docker run -d --name jiyu-test -e JIYU_ORIGIN=http://127.0.0.1:3000 -p 127.0.0.1:3000:3000 jiyu:test
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3000/api/health; then exit 0; fi
            sleep 2
          done
          docker logs jiyu-test
          exit 1
      - name: Validate deployment configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" -e JIYU_DOMAIN=files.example.com caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
      - name: Verify native PDF and OCR in runtime image
        run: docker exec -e JIYU_REQUIRE_NATIVE_TESTS=1 jiyu-test node --experimental-strip-types --test --test-timeout=30000 server/content-native.test.ts
      - name: Verify v0.3 upgrade and rollback in runtime image
        run: |
          git fetch --no-tags origin tag v0.3.0
          mkdir -p .artifacts/legacy-v0.3
          git archive v0.3.0 server src package.json | tar -x -C .artifacts/legacy-v0.3
          docker exec --user root jiyu-test mkdir -p /app/.artifacts
          docker exec --user root jiyu-test chown node:node /app/.artifacts
          docker cp .artifacts/legacy-v0.3 jiyu-test:/app/.artifacts/legacy-v0.3
          docker exec -e JIYU_LEGACY_ROOT=/app/.artifacts/legacy-v0.3 jiyu-test node --experimental-strip-types --test --test-timeout=30000 server/upgrade.test.ts
      - name: Clean up
        if: always()
        run: docker rm -f jiyu-test || true
